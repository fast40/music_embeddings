[project]
name = "music-embeddings"
version = "0.1.0"
description = "Music embedding experiments on NSynth"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv.build-backend]
module-name = "music_embeddings"
